{% extends 'base.html' %}
{% load static %}
{% block title %}Reset Password{% endblock %}

{% block body %}
<div class="container py-5" style="max-width: 480px;">
  <div class="card shadow-sm p-4">
    <h2 class="mb-4 text-center">Set Your Email and New Password</h2> 

    <form method="POST" id="resetForm" novalidate>
      {% csrf_token %}

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control" name="email" id="email" 
               placeholder="you@traverse.com" 
               value="{{ email|default:'' }}"
               {% if otp_verified %}readonly{% endif %}
               required>
      </div>

      <div class="d-grid mb-3">
        <button type="button" class="btn btn-primary" id="sendOtpBtn" 
                onclick="sendOTP()" 
                {% if otp_verified %}disabled{% endif %}>
          Send OTP
        </button>
      </div>

      <div class="mb-3">
        <label for="otp" class="form-label fw-semibold">Enter OTP</label>
        <input type="text" class="form-control" name="otp" id="otp" 
               {% if not otp_verified %}disabled{% endif %}
               {% if otp_verified %}readonly{% endif %}
               value="{{ entered_otp|default:'' }}"
               maxlength="6" autocomplete="one-time-code" required 
               placeholder="6-digit OTP">
      </div>

      <div class="mb-3">
        <label for="password1" class="form-label fw-semibold">New Password</label>
        <input type="password" class="form-control" name="password1" id="password1" 
               {% if not otp_verified %}disabled{% endif %}
               autocomplete="new-password" required 
               placeholder="Enter new password">
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label fw-semibold">Confirm New Password</label>
        <input type="password" class="form-control" name="password2" id="password2" 
               {% if not otp_verified %}disabled{% endif %}
               autocomplete="new-password" required 
               placeholder="Confirm new password">
      </div>

      <div class="d-grid">
        <button type="submit" class="btn btn-success" id="submitBtn" 
                {% if not otp_verified %}disabled{% endif %}>
          Set Password & Email
        </button>
      </div>

      <div id="message" class="mt-3 text-center fw-semibold">
        {% if error %}
          <div class="text-danger">{{ error }}</div>
        {% endif %}
      </div>
    </form>
  </div>
</div>

<script>
  // Initialize page state based on server-side variables
  let otpVerified = {{ otp_verified|yesno:"true,false" }};
  let userEmail = "{{ email|default:'' }}";
  let enteredOtp = "{{ entered_otp|default:'' }}";
  
  // Set initial state when page loads
  document.addEventListener('DOMContentLoaded', function() {
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const otpInput = document.getElementById('otp');
    const password1 = document.getElementById('password1');
    const password2 = document.getElementById('password2');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('email');
    const msgDiv = document.getElementById('message');
    
    if (otpVerified) {
      // If OTP is already verified, set the form to the verified state
      sendOtpBtn.disabled = true;
      otpInput.disabled = false;
      otpInput.readOnly = true;
      emailInput.readOnly = true;
      password1.disabled = false;
      password2.disabled = false;
      submitBtn.disabled = false;
      
      // Set a success message if not showing an error
      if (!msgDiv.querySelector('.text-danger')) {
        msgDiv.innerHTML = '<div class="text-success">OTP verified! You can now set your new password.</div>';
      }
      
      // Focus on first password field
      password1.focus();
    } else if (userEmail && enteredOtp) {
      // If email was entered and OTP was attempted but not verified
      sendOtpBtn.disabled = true;
      otpInput.disabled = false;
      otpInput.focus();
    } else if (userEmail) {
      // If email was entered but no OTP sent yet
      sendOtpBtn.disabled = true;
      otpInput.disabled = false;
      otpInput.focus();
    }
  });

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }

  function sendOTP() {
    const email = document.getElementById('email').value.trim();
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const otpInput = document.getElementById('otp');
    const msgDiv = document.getElementById('message');

    if (!email) {
      alert('Please enter your email.');
      return;
    }

    // Show loading state
    sendOtpBtn.disabled = true;
    sendOtpBtn.textContent = 'Sending...';

    fetch("{% url 'verify_otp' %}", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": getCookie('csrftoken')
      },
      body: JSON.stringify({ email: email })
    })
    .then(response => response.json())
    .then(data => {
      msgDiv.innerHTML = `<div class="text-${data.success ? 'success' : 'danger'}">${data.message}</div>`;

      if (data.success) {
        sendOtpBtn.textContent = 'OTP Sent';
        otpInput.disabled = false;
        otpInput.focus();
        otpVerified = false; // Reset this since we're sending a new OTP
        userEmail = email;
      } else {
        sendOtpBtn.disabled = false;
        sendOtpBtn.textContent = 'Send OTP';
      }
    })
    .catch(() => {
      msgDiv.innerHTML = '<div class="text-danger">Error sending OTP. Try again.</div>';
      sendOtpBtn.disabled = false;
      sendOtpBtn.textContent = 'Send OTP';
    });
  }

  document.getElementById('otp').addEventListener('input', function () {
    // Only verify OTP if it wasn't already verified from server-side
    if (otpVerified) return;
    
    const otp = this.value.trim();
    const email = document.getElementById('email').value.trim();
    const msgDiv = document.getElementById('message');

    if (otp.length === 6) {
      fetch("{% url 'verify_otp_check' %}", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie('csrftoken')
        },
        body: JSON.stringify({ email: email, otp: otp })
      })
      .then(res => res.json())
      .then(data => {
        if (data.valid) {
          msgDiv.innerHTML = '<div class="text-success">OTP verified! You can now set your new password.</div>';

          document.getElementById('email').readOnly = true;
          this.readOnly = true;

          document.getElementById('password1').disabled = false;
          document.getElementById('password2').disabled = false;
          document.getElementById('submitBtn').disabled = false;
          document.getElementById('password1').focus();
          
          otpVerified = true;
        } else {
          msgDiv.innerHTML = '<div class="text-danger">Invalid OTP.</div>';

          document.getElementById('password1').disabled = true;
          document.getElementById('password2').disabled = true;
          document.getElementById('submitBtn').disabled = true;
        }
      })
      .catch(() => {
        msgDiv.innerHTML = '<div class="text-danger">Error verifying OTP.</div>';
      });
    } else {
      msgDiv.innerHTML = "";
      document.getElementById('password1').disabled = true;
      document.getElementById('password2').disabled = true;
      document.getElementById('submitBtn').disabled = true;
    }
  });
</script>
{% endblock %}
